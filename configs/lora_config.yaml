model:
  name: Qwen/Qwen2.5-0.5B
  fp16: true
  gradient_checkpointing: true

dataset:
  name: sahil2801/CodeAlpaca-20k
  subset_size: 1000
  seed: 42

training:
  batch_size: 1
  seq_length: 256
  grad_accumulation_steps: 4
  learning_rate: 1.0e-4
  num_epochs: 1

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

logging:
  output_dir: logs
  run_tag: default